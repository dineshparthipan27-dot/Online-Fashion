<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Vogue Boutique</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --primary: #e53637;
            --dark: #111111;
            --light: #f3f2ee;
            --white: #ffffff;
            --text-gray: #777777;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }


        .error-container {
            max-width: 600px;
            width: 100%;
        }


        .error-code {
            font-size: 180px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 10px;
            text-shadow: 10px 10px 20px rgba(229, 54, 55, 0.2);

            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }


        .error-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 15px;
            animation: fadeInUp 0.8s ease 0.3s forwards;
            opacity: 0;
        }

        .error-desc {
            font-size: 16px;
            color: var(--text-gray);
            margin-bottom: 40px;
            line-height: 1.6;
            animation: fadeInUp 0.8s ease 0.5s forwards;
            opacity: 0;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        .error-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            animation: fadeInUp 0.8s ease 0.7s forwards;
            opacity: 0;
        }


        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--primary);
            color: var(--white);
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(229, 54, 55, 0.3);
            border: 2px solid var(--primary);
        }

        .btn-primary:hover {
            background-color: transparent;
            color: var(--primary);
            transform: translateY(-3px);
        }


        .btn-outline {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: transparent;
            color: var(--dark);
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 30px;
            border: 2px solid var(--dark);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-outline:hover {
            background-color: var(--dark);
            color: var(--white);
            transform: translateY(-3px);
        }


        @media (max-width: 768px) {
            .error-code {
                font-size: 130px;
            }

            .error-title {
                font-size: 26px;
            }

            .error-desc {
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 100px;
            }

            .error-title {
                font-size: 22px;
            }

            .error-actions {
                flex-direction: column;
                gap: 15px;
            }

            .btn-primary,
            .btn-outline {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <div class="error-container">

        <h1 class="error-code">404</h1>


        <h2 class="error-title">Oops! Page went out of style.</h2>
        <p class="error-desc">The fashion item or page you are looking for might have been removed, had its name
            changed, or is temporarily unavailable.</p>


        <div class="error-actions">

            <button onclick="window.history.back()" class="btn-outline">
                <i class="fas fa-arrow-left"></i> Go Back
            </button>


            <a href="index.html" class="btn-primary">
                <i class="fas fa-home"></i> Go to Home
            </a>
        </div>
    </div>

</body>

</html>
